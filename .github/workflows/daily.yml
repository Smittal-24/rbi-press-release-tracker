name: RBI tracker daily

on:
  schedule:
    - cron: "45 11 * * *"        # 11:45 UTC = 17:15 IST
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (print messages, post nothing, save nothing)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: rbi-tracker
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run the tracker
        env:
          PYTHONPATH: src
          GCHAT_WEBHOOK_URL: ${{ secrets.GCHAT_WEBHOOK_URL }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python -m rbi_tracker.cli run --dry-run
          else
            python -m rbi_tracker.cli run
          fi
      - name: Save updated data
        if: always() && inputs.dry_run != true
        run: |
          git config user.name "rbi-tracker-bot"
          git config user.email "rbi-tracker-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "chore: update tracker data [skip ci]" && git push)